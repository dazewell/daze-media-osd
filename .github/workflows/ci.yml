name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-dotnet@v5
        with:
          global-json-file: global.json
      - name: Build
        run: dotnet build DazeMediaOsd.slnx -c Release -nologo
      - name: Test
        run: dotnet test --solution DazeMediaOsd.slnx -c Release --no-build
